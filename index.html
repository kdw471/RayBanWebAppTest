<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed HUD</title>
<style>
/* Meta Ray-Ban Display: 600x600 단안 20도.
   추적 중에는 화면이 꺼져 있고 핀치할 때만 3초 켜집니다.
   도파관은 켜진 픽셀에 비례해 전력을 쓰므로 이게 가장 큰 절전 수단입니다. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;user-select:none}
#app{height:100%;display:flex;flex-direction:column;
  justify-content:space-between;padding:5vmin 5.5vmin}
#app.dark{visibility:hidden}          /* 소등 — 완전 검정 */

.bar{display:flex;justify-content:space-between;align-items:center;
  font-size:3.4vmin;letter-spacing:.08em;color:#7d8a87;min-height:4vmin}
.bar b{font-weight:600}
.src.gps b{color:#4FD6BE}
.src.stride b{color:#E0A03A}
.src.none b{color:#E2705E}

.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.big{font-size:24vmin;line-height:.88;font-weight:700;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.big.sm{font-size:17vmin}
.unit{font-size:5.4vmin;letter-spacing:.16em;color:#7d8a87;margin-top:1.6vmin}

.sub{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin 4vmin;
  font-size:3.6vmin;color:#7d8a87;font-variant-numeric:tabular-nums}
.sub div{display:flex;justify-content:space-between;gap:2vmin}
.sub b{color:#fff;font-weight:600}

.title{font-size:4.6vmin;font-weight:700;letter-spacing:-.01em}
.note{font-size:3.5vmin;color:#7d8a87;line-height:1.45}
.hint{font-size:3.5vmin;color:#4FD6BE}
.err{color:#E2705E}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.2vmin}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ────────────────────────────────────────────────────────────
   뉴럴 밴드 = 표준 키보드 이벤트
     검지 핀치 Enter · 중지 핀치 Escape · 엄지 스와이프 Arrow*

   속도 출처 두 가지
     1) GPS      — 페어링된 폰에서 옵니다. 안경에는 위치 센서가 없습니다.
     2) 보폭 추정 — 케이던스 x 보폭. 가속도를 적분하지 않으므로
                   드리프트가 누적되지 않습니다. GPS도 네트워크도 쓰지 않아
                   실내·터널·빌딩 사이에서 유일하게 살아남는 경로입니다.

   보폭은 세 경로로 정해집니다
     · 20걸음 실측 (가장 정확)
     · 스와이프로 직접 조절
     · GPS가 좋을 때 자동 보정 (쓸수록 정밀해짐)
   ──────────────────────────────────────────────────────────── */

var MEASURE_STEPS = 20;             // 실측에 쓸 걸음 수
var SHOW_MS = 3000;                 // 핀치 1회당 표시 시간

var UNITS = ["kmh", "ms"];
var unitIdx = 0;
var strideLen = null;               // m
try {
  var u = localStorage.getItem("speedhud.unit");   if (u !== null) unitIdx = +u ? 1 : 0;
  var s = localStorage.getItem("speedhud.stride"); if (s !== null) strideLen = +s || null;
} catch (e) {}

// 보폭이 없으면 설정부터 받습니다.
var state = strideLen === null ? "setup" : "idle";
var errMsg = "";
var watchId = null;

var speed = 0, source = "none";
var acc = null, lastFix = null;
var maxSpeed = 0, distance = 0, movingMs = 0;
var cadence = 0;
var showUntil = 0;

var draftStride = strideLen || 0.75;   // 설정 화면에서 조절 중인 값
var walkSteps = 0;                     // 실측 중 걸음 수
var draftDist = 20;                    // 실측 구간 거리(m)
var motionOn = false;

/* ── 모션 센서 ──────────────────────────────────────────────
   권한 요청은 사용자 제스처 안에서만 통과합니다. */
function enableMotion() {
  if (motionOn) return;
  try {
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission()
        .then(function (r) {
          if (r === "granted") { window.addEventListener("devicemotion", onMotion); motionOn = true; render(); }
        })
        .catch(function () {});
    } else {
      window.addEventListener("devicemotion", onMotion); motionOn = true;
    }
  } catch (e) {}
}

var steps = [], lastPeak = 0;
function onMotion(e) {
  var a = e.accelerationIncludingGravity;
  if (!a) return;
  var m = Math.sqrt((a.x || 0) * (a.x || 0) + (a.y || 0) * (a.y || 0) + (a.z || 0) * (a.z || 0));
  var now = Date.now();
  if (m > 13 && now - lastPeak > 250) {
    lastPeak = now;
    steps.push(now);
    if (state === "walk") {
      walkSteps++;
      if (walkSteps >= MEASURE_STEPS) state = "dist";
      render();
    }
  }
  while (steps.length && now - steps[0] > 10000) steps.shift();
  cadence = Math.round(steps.length * 6);          // 10초 창 → 분당
}

/* ── GPS ───────────────────────────────────────────────────── */
function haversine(a, b) {
  var R = 6371000, t = Math.PI / 180;
  var dLat = (b.lat - a.lat) * t, dLon = (b.lon - a.lon) * t;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

function onFix(pos) {
  var c = pos.coords, now = pos.timestamp || Date.now();
  acc = c.accuracy;

  var inst = null;
  if (c.speed !== null && c.speed !== undefined && c.speed >= 0 && !isNaN(c.speed)) inst = c.speed;

  var fix = { lat: c.latitude, lon: c.longitude, t: now };
  if (lastFix) {
    var dt = (now - lastFix.t) / 1000;
    if (dt > 0.2) {
      var d = haversine(lastFix, fix);
      if (d > Math.max(3, (acc || 10) * 0.5)) {     // 정확도 이하 이동은 지터로 폐기
        if (inst === null) inst = d / dt;
        distance += d; movingMs += dt * 1000;
      } else if (inst === null) inst = 0;
    }
  }
  lastFix = fix;

  if (inst !== null && acc !== null && acc <= 30) {
    speed = speed === 0 ? inst : speed * 0.7 + inst * 0.3;
    if (speed < 0.4) speed = 0;
    if (speed > maxSpeed) maxSpeed = speed;
    source = "gps";
    learnStride();
  }
}

/* GPS가 믿을 만하고 실제로 걷고 있을 때만 보폭을 다듬습니다. */
function learnStride() {
  if (acc === null || acc > 15 || cadence < 40 || speed < 0.8) return;
  var observed = speed * 60 / cadence;
  if (observed < 0.3 || observed > 2.5) return;
  strideLen = strideLen === null ? observed : strideLen * 0.9 + observed * 0.1;
  saveStride();
}
function saveStride() {
  try { localStorage.setItem("speedhud.stride", strideLen.toFixed(3)); } catch (e) {}
}

function onFixErr(e) {
  if (e.code === 1) { state = "error"; errMsg = "위치 권한이 거부되었습니다"; }
  else acc = null;
}

/* GPS가 죽으면 보폭 추정으로 이어갑니다. */
function fallback() {
  var stale = acc === null || acc > 30 || (lastFix && Date.now() - lastFix.t > 5000);
  if (!stale) return;
  if (cadence >= 40 && strideLen) {
    var est = cadence * strideLen / 60;
    speed = speed === 0 ? est : speed * 0.7 + est * 0.3;
    if (speed > maxSpeed) maxSpeed = speed;
    source = "stride";
  } else {
    speed = 0;                                     // 신호도 걸음도 없으면 정지
    source = "none";
  }
}

/* ── 표시 ──────────────────────────────────────────────────── */
function fmt(mps) {
  return UNITS[unitIdx] === "ms"
    ? { v: mps.toFixed(1), u: "m/s" }
    : { v: (mps * 3.6).toFixed(1), u: "km/h" };
}
function fmtTime(ms) {
  var t = Math.floor(ms / 1000), m = Math.floor(t / 60), s = t % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function srcInfo() {
  if (source === "gps")    return { c: "gps",    t: "GPS" };
  if (source === "stride") return { c: "stride", t: "보폭" };
  return { c: "none", t: "신호없음" };
}
function shell(top, body, bottom) {
  return '<div class="bar">' + top + '</div>' + body + '<div class="bar">' + bottom + '</div>';
}

function render() {
  var app = document.getElementById("app");

  if (state === "tracking" && Date.now() >= showUntil) { app.className = "dark"; return; }
  app.className = "";

  if (state === "setup") {
    app.innerHTML = shell(
      '<span>보폭 설정</span><span>' + (strideLen ? "저장됨" : "첫 실행") + '</span>',
      '<div class="mid"><div class="big sm">' + draftStride.toFixed(2) + '</div>' +
        '<div class="unit">m / 걸음</div></div>',
      '<span>↑↓ 조절 · 핀치 확정</span><span class="hint">→ 실측</span>');
    return;
  }
  if (state === "walk") {
    app.innerHTML = shell(
      '<span>보폭 실측</span><span>' + (motionOn ? "" : "센서 준비 중") + '</span>',
      '<div class="card"><div class="title">평소 걸음으로 걸으세요</div>' +
        '<div class="big sm">' + walkSteps + '<span class="unit"> / ' + MEASURE_STEPS + '</span></div>' +
        '<div class="note">' + MEASURE_STEPS + '걸음을 채우면 거리를 묻습니다.</div></div>',
      '<span class="hint">중지 핀치 · 취소</span><span></span>');
    return;
  }
  if (state === "dist") {
    app.innerHTML = shell(
      '<span>걸은 거리</span><span>' + MEASURE_STEPS + '걸음</span>',
      '<div class="mid"><div class="big sm">' + draftDist + '</div><div class="unit">m</div></div>',
      '<span>↑↓ 조절 · 핀치 확정</span><span>보폭 ' +
        (draftDist / MEASURE_STEPS).toFixed(2) + 'm</span>');
    return;
  }
  if (state === "idle") {
    app.innerHTML = shell(
      '<span>SPEED HUD</span><span>보폭 ' + (strideLen ? strideLen.toFixed(2) + 'm' : '미설정') + '</span>',
      '<div class="card"><div class="title">이동 속도</div>' +
        '<div class="note">GPS는 페어링된 폰에서 옵니다.<br>끊기면 보폭 추정으로 이어집니다.</div>' +
        '<div class="hint">검지 핀치로 시작</div></div>',
      '<span>↑↓ 보폭 다시 설정</span><span>←→ 단위</span>');
    return;
  }
  if (state === "asking") {
    app.innerHTML = shell('<span>SPEED HUD</span><span></span>',
      '<div class="card"><div class="title">권한 요청 중</div>' +
      '<div class="note">폰에서 위치 권한을 허용해 주십시오.</div></div>', '<span></span><span></span>');
    return;
  }
  if (state === "error") {
    app.innerHTML = shell('<span>SPEED HUD</span><span></span>',
      '<div class="card"><div class="title err">시작할 수 없습니다</div>' +
      '<div class="note">' + errMsg + '</div>' +
      '<div class="hint">검지 핀치로 다시 시도</div></div>', '<span></span><span></span>');
    return;
  }

  var f = fmt(speed), si = srcInfo();
  var avg = movingMs > 1000 ? distance / (movingMs / 1000) : 0;
  app.innerHTML =
    '<div class="bar"><span class="src ' + si.c + '"><b>' + si.t + '</b>' +
      (source === "gps" && acc !== null ? " " + Math.round(acc) + "m" : "") + '</span>' +
      '<span>' + fmtTime(movingMs) + '</span></div>' +
    '<div class="mid"><div class="big">' + f.v + '</div><div class="unit">' + f.u + '</div></div>' +
    '<div class="sub">' +
      '<div><span>평균</span><b>' + fmt(avg).v + '</b></div>' +
      '<div><span>최고</span><b>' + fmt(maxSpeed).v + '</b></div>' +
      '<div><span>거리</span><b>' + (distance / 1000).toFixed(2) + ' km</b></div>' +
      '<div><span>케이던스</span><b>' + (cadence || "--") + ' spm</b></div>' +
    '</div>';
}

function flash() { showUntil = Date.now() + SHOW_MS; render(); }

/* ── 추적 시작 · 정지 ──────────────────────────────────────── */
function start() {
  enableMotion();
  if (!navigator.geolocation) { state = "error"; errMsg = "이 기기에서 위치를 쓸 수 없습니다"; return render(); }
  state = "asking"; render();

  watchId = navigator.geolocation.watchPosition(function (p) {
    if (state === "asking") { state = "tracking"; flash(); }
    onFix(p);
  }, onFixErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });

  // GPS가 한 번도 안 잡혀도 보폭 추정만으로 시작할 수 있게 합니다.
  setTimeout(function () { if (state === "asking") { state = "tracking"; flash(); } }, 4000);
}

function stop() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  state = "idle";
  speed = 0; maxSpeed = 0; distance = 0; movingMs = 0;
  lastFix = null; steps = []; cadence = 0; source = "none"; acc = null; showUntil = 0;
  render();
}

/* ── 입력 ──────────────────────────────────────────────────── */
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

document.addEventListener("keydown", function (e) {
  var k = e.key;
  e.preventDefault();

  if (state === "setup") {
    if (k === "ArrowUp")         draftStride = clamp(+(draftStride + 0.01).toFixed(2), 0.30, 2.50);
    else if (k === "ArrowDown")  draftStride = clamp(+(draftStride - 0.01).toFixed(2), 0.30, 2.50);
    else if (k === "ArrowRight") { walkSteps = 0; state = "walk"; enableMotion(); }
    else if (k === "Enter")      { strideLen = draftStride; saveStride(); state = "idle"; }
    else if (k === "Escape" && strideLen) state = "idle";
    return render();
  }

  if (state === "walk") {
    if (k === "Escape") state = "setup";
    return render();
  }

  if (state === "dist") {
    if (k === "ArrowUp")        draftDist = clamp(draftDist + 1, 5, 100);
    else if (k === "ArrowDown") draftDist = clamp(draftDist - 1, 5, 100);
    else if (k === "Enter") {
      strideLen = draftDist / MEASURE_STEPS;
      draftStride = strideLen;
      saveStride();
      state = "idle";
    } else if (k === "Escape") state = "setup";
    return render();
  }

  if (state === "idle" || state === "error") {
    if (k === "Enter") start();
    else if (k === "ArrowUp" || k === "ArrowDown") {
      draftStride = strideLen || 0.75; state = "setup"; render();
    }
    return;
  }

  if (state === "tracking") {
    if (k === "Enter") flash();                                  // 3초 표시
    else if (k === "ArrowLeft" || k === "ArrowRight") {           // 단위 전환
      unitIdx = unitIdx === 0 ? 1 : 0;
      try { localStorage.setItem("speedhud.unit", unitIdx); } catch (err) {}
      flash();
    } else if (k === "Escape") stop();
  }
});

// 브라우저 테스트용 대체 입력
document.addEventListener("click", function () {
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
});

setInterval(function () {
  if (state === "tracking") { fallback(); render(); }
}, 250);

render();
</script>
</body>
</html>
